<text x="22" y="285" font-size="13" style="fill:var(--viz-muted)">4-vCPU container, headless Chrome, no CPU</text>
<text x="22" y="302" font-size="13" style="fill:var(--viz-muted)">throttling; 2–3 runs per value; August 2026.</text>
