<svg class="art-diagram-narrow" aria-hidden="true" focusable="false" id="perf-emdash-mobile" width="317" height="207" viewBox="20.5 99.5 317 207" xmlns="http://www.w3.org/2000/svg"><title>Highlighting the first code block on a page</title><style>svg{--bg:#faf9f5;--ink:#141413;--ink-2:#4c4b45;--line:#14141338;--line-soft:#1414131c;--accent:#c15f3c;--viz-b9:#8e8c87;--viz-m1:#3d3d3a;--viz-muted:#65645e;--fig-focal:var(--accent);background:var(--bg)}</style><style>#perf-emdash-mobile text{font-family:'Anthropic Sans','Anthropic Sans Fallback','Anthropic Sans Fallback Roboto',system-ui,sans-serif}</style>
<line x1="70" y1="101" x2="70" y2="239" stroke-width="1" style="stroke:var(--line)"/>
<text x="70" y="255" text-anchor="middle" font-size="13" style="fill:var(--viz-muted)">0</text>
