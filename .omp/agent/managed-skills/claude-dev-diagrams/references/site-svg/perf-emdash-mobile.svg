<line x1="241" y1="101" x2="241" y2="239" stroke-width="1" style="stroke:var(--line-soft)"/>
<text x="241" y="255" text-anchor="middle" font-size="13" style="fill:var(--viz-muted)">750 ms</text>
<line x1="298" y1="101" x2="298" y2="239" stroke-width="1" style="stroke:var(--line-soft)"/>
<text x="298" y="255" text-anchor="middle" font-size="13" style="fill:var(--viz-muted)">1 s</text>
<text x="22" y="119" font-size="13" stroke-width="3" stroke-linejoin="round" paint-order="stroke" style="fill:var(--viz-m1);stroke:var(--bg)">First TypeScript block on a page</text>
