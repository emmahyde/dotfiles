<text x="332" y="146" text-anchor="end" font-size="13" style="fill:var(--ink-2)">Claude</text>
<text x="66" y="93.5" font-size="13" font-weight="600" style="fill:var(--ink)">Open a thread</text>
<text x="66" y="111" font-size="13" style="fill:var(--viz-muted)">a slow stretch, a recording</text>
<text x="66" y="169.5" font-size="13" font-weight="600" style="fill:var(--ink)">Build a benchmark</text>
<text x="66" y="187" font-size="13" style="fill:var(--viz-muted)">trace it, reproduce in the lab</text>
<text x="66" y="221.5" font-size="13" font-weight="600" style="fill:var(--ink)">Pull request</text>
<text x="66" y="239" font-size="13" style="fill:var(--viz-muted)">several, sized for review</text>
<text x="66" y="273.5" font-size="13" font-weight="600" style="fill:var(--ink)">Deploy</text>
