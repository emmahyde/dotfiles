<rect x="22" y="458" width="150.08" height="10" style="fill:var(--fig-focal)"/>
<text class="tnum" x="298" y="467.5" font-size="13" font-weight="600" style="fill:var(--ink)">−44%</text>
<text x="22" y="498" font-size="13" style="fill:var(--viz-muted)"><tspan x="22">Two hot paths, instruction count against</tspan><tspan x="22" dy="17">wall-clock time. Counts under Valgrind with</tspan><tspan x="22" dy="17"><tspan class="mono">node --predictable</tspan>; timings on the same</tspan><tspan x="22" dy="17">benchmark under plain <tspan class="mono">node</tspan> with the JIT warm.</tspan></text>
