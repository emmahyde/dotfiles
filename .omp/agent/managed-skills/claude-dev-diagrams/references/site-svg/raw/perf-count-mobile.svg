<rect x="22" y="183" width="139.36" height="10" style="fill:var(--fig-focal)"/>
<text class="tnum" x="298" y="192.5" font-size="13" font-weight="600" style="fill:var(--ink)">−48%</text>
<text x="22" y="223" font-size="13" style="fill:var(--viz-m1)">Wall-clock</text>
<rect x="22" y="231" width="268" height="10" style="fill:var(--viz-b9)"/>
<rect x="22" y="247" width="58.96" height="10" style="fill:var(--fig-focal)"/>
<text class="tnum" x="298" y="256.5" font-size="13" font-weight="600" style="fill:var(--ink)">−78%</text>
<line x1="22" y1="277.5" x2="340" y2="277.5" stroke-width="1" style="stroke:var(--line-soft)"/>
<text x="22" y="307" font-size="17" font-weight="500" style="fill:var(--ink)">Status-line scanner</text>
<text class="tnum" x="340" y="308" text-anchor="end" font-size="12" style="fill:var(--ink)"><tspan font-size="24" font-weight="600" style="fill:var(--ink)">1.8x</tspan><tspan dx="4" font-size="13" style="fill:var(--viz-muted)">faster</tspan></text>
<text x="22" y="326" font-size="13" style="fill:var(--viz-muted)">cheap first-character check</text>
<text x="22" y="342" font-size="13" style="fill:var(--viz-muted)">before the regex</text>
