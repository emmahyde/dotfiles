<svg class="art-diagram-narrow" aria-hidden="true" focusable="false" id="perf-count-mobile" width="323" height="487.5" viewBox="19.5 66 323 487.5" xmlns="http://www.w3.org/2000/svg"><style>#perf-count-mobile text{font-family:'Anthropic Sans','Anthropic Sans Fallback','Anthropic Sans Fallback Roboto',system-ui,sans-serif}#perf-count-mobile .tnum{font-variant-numeric:tabular-nums}#perf-count-mobile .mono{font-family:'Anthropic Mono','Anthropic Mono Fallback',ui-monospace,'SF Mono',Menlo,monospace}</style>
<line x1="22" y1="67.5" x2="340" y2="67.5" stroke-width="1" style="stroke:var(--line)"/>
<text x="22" y="97" font-size="17" font-weight="500" style="fill:var(--ink)">Message-tree assembly</text>
<text class="tnum" x="340" y="98" text-anchor="end" font-size="12" style="fill:var(--ink)"><tspan font-size="24" font-weight="600" style="fill:var(--ink)">4.6x</tspan><tspan dx="4" font-size="13" style="fill:var(--viz-muted)">faster</tspan></text>
<text x="22" y="116" font-size="13" style="fill:var(--viz-muted)">each message ID resolved</text>
<text x="22" y="132" font-size="13" style="fill:var(--viz-muted)">once instead of three times</text>
