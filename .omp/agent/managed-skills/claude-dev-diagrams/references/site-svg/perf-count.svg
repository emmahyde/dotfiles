<svg class="art-diagram-wide" aria-hidden="true" focusable="false" id="perf-count" width="652.5" height="236" viewBox="33.5 90.5 652.5 236" xmlns="http://www.w3.org/2000/svg"><title>Does the count track the clock?</title><style>svg{--bg:#faf9f5;--ink:#141413;--ink-2:#4c4b45;--line:#14141338;--line-soft:#1414131c;--accent:#c15f3c;--viz-b9:#8e8c87;--viz-m1:#3d3d3a;--viz-muted:#65645e;--fig-focal:var(--accent);background:var(--bg)}</style><style>#perf-count text{font-family:'Anthropic Sans','Anthropic Sans Fallback','Anthropic Sans Fallback Roboto',system-ui,sans-serif}#perf-count .tnum{font-variant-numeric:tabular-nums}#perf-count .mono{font-family:'Anthropic Mono','Anthropic Mono Fallback',ui-monospace,'SF Mono',Menlo,monospace}</style>
