<text x="36" y="306" font-size="12" style="fill:var(--viz-muted)"><tspan x="36">Two hot paths, instruction count against wall-clock time. Counts under Valgrind with <tspan class="mono">node --predictable</tspan>;</tspan><tspan x="36" dy="16">timings on the same benchmark under plain <tspan class="mono">node</tspan> with the JIT warm.</tspan></text>
