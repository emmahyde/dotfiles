<rect x="419" y="154" width="24.64" height="10" style="fill:var(--fig-focal)"/>
<text class="tnum" x="539" y="163.5" font-size="13" font-weight="600" style="fill:var(--ink)">−78%</text>
<text class="tnum" x="684" y="163.5" text-anchor="end" font-size="12" style="fill:var(--ink)"><tspan font-size="24" font-weight="600" style="fill:var(--ink)">4.6x</tspan><tspan dx="4" font-size="12" style="fill:var(--viz-muted)">faster</tspan></text>
