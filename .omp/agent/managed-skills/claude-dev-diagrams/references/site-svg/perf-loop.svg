<text x="164" y="108" font-size="13" style="fill:var(--ink-2)">Claude</text>
<text x="36" y="132" font-size="13" font-weight="600" style="fill:var(--ink)">Open a thread</text>
<text x="36" y="149" font-size="12" style="fill:var(--viz-muted)">a slow stretch,</text>
<text x="36" y="164" font-size="12" style="fill:var(--viz-muted)">a recording</text>
<text x="163" y="132" font-size="13" font-weight="600" style="fill:var(--ink)">Build a benchmark</text>
<text x="163" y="149" font-size="12" style="fill:var(--viz-muted)">trace it, reproduce</text>
<text x="163" y="164" font-size="12" style="fill:var(--viz-muted)">in the lab</text>
<text x="290" y="132" font-size="13" font-weight="600" style="fill:var(--ink)">Pull request</text>
<text x="290" y="149" font-size="12" style="fill:var(--viz-muted)">several, sized</text>
<text x="290" y="164" font-size="12" style="fill:var(--viz-muted)">for review</text>
<text x="417" y="132" font-size="13" font-weight="600" style="fill:var(--ink)">Deploy</text>
