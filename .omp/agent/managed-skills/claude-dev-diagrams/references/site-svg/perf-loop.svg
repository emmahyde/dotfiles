<text x="544" y="132" font-size="13" font-weight="600" style="fill:var(--ink)">Read the field</text>
<text x="544" y="149" font-size="12" style="fill:var(--viz-muted)">real users, by build</text>
<text x="544" y="164" font-size="12" style="fill:var(--viz-muted)">and platform</text>
