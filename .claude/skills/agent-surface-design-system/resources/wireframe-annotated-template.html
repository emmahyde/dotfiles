<!--
  Wireframe Annotated Template
  Law 38: Redline specs are static annotations

  A two-column redline wireframe: greybox canvas on the left,
  numbered pins on the canvas, matching spec rows on the right.
  Wrap this HTML in an <artifact type="text/html"> block when emitting
  from an agent.
-->
<artifact identifier="wireframe-example" type="text/html" title="Annotated Wireframe">
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotated Wireframe</title>
  <style>
    :root {
      --accent: #ff6b6b;
      --grey-1: #e5e5e5;
      --grey-2: #c2c2c2;
      --grey-3: #9e9e9e;
      --text: #222;
      --bg: #fafafa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    .canvas {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .browser-chrome {
      border: 2px solid var(--grey-3);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .browser-bar {
      height: 32px;
      background: var(--grey-1);
      border-bottom: 2px solid var(--grey-2);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--grey-3); }
    .page { padding: 24px; display: flex; flex-direction: column; gap: 24px; position: relative; }
    .pin {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .greybox {
      background: var(--grey-1);
      border: 2px solid var(--grey-2);
      border-radius: 6px;
      padding: 20px;
      position: relative;
    }
    .nav { display: flex; justify-content: space-between; align-items: center; }
    .logo { width: 96px; height: 24px; background: var(--grey-2); border-radius: 4px; }
    .nav-links { display: flex; gap: 16px; }
    .nav-link { width: 64px; height: 12px; background: var(--grey-2); border-radius: 4px; }
    .btn { width: 80px; height: 28px; background: var(--grey-3); border-radius: 4px; }
    .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .hero-text { display: flex; flex-direction: column; gap: 12px; }
    .h1 { width: 80%; height: 32px; background: var(--grey-2); border-radius: 4px; }
    .p { width: 100%; height: 14px; background: var(--grey-2); border-radius: 4px; }
    .hero-actions { display: flex; gap: 12px; margin-top: 8px; }
    .placeholder { aspect-ratio: 16/10; background: var(--grey-1); border: 2px dashed var(--grey-3); display: flex; align-items: center; justify-content: center; font-size: 48px; color: var(--grey-3); }
    .logo-strip { display: flex; justify-content: space-around; }
    .partner { width: 64px; height: 32px; background: var(--grey-2); border-radius: 4px; }
    .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .feature { display: flex; flex-direction: column; gap: 12px; }
    .icon { width: 40px; height: 40px; background: var(--grey-2); border-radius: 6px; }
    .footer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .link { height: 10px; background: var(--grey-2); border-radius: 4px; }
    .spec-panel {
      width: 280px;
      border-left: 2px solid var(--grey-2);
      background: #fff;
      padding: 24px;
      overflow-y: auto;
    }
    .spec-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
    .spec-row { display: flex; gap: 12px; margin-bottom: 16px; font-family: "IBM Plex Mono", monospace; font-size: 13px; line-height: 1.45; }
    .spec-num { color: var(--accent); font-weight: 700; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="browser-chrome">
      <div class="browser-bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="page">
        <div class="pin" style="top: 28px; right: 28px;">①</div>
        <div class="greybox nav">
          <div class="logo"></div>
          <div class="nav-links"><div class="nav-link"></div><div class="nav-link"></div><div class="nav-link"></div></div>
          <div class="btn"></div>
        </div>

        <div class="pin" style="top: 130px; right: 28px;">②</div>
        <div class="greybox hero">
          <div class="hero-text">
            <div class="h1"></div>
            <div class="p"></div>
            <div class="hero-actions"><div class="btn"></div><div class="btn"></div></div>
          </div>
          <div class="placeholder">×</div>
        </div>

        <div class="pin" style="top: 320px; right: 28px;">③</div>
        <div class="greybox logo-strip">
          <div class="partner"></div><div class="partner"></div><div class="partner"></div><div class="partner"></div><div class="partner"></div>
        </div>

        <div class="pin" style="top: 400px; right: 28px;">④</div>
        <div class="greybox feature-grid">
          <div class="feature"><div class="icon"></div><div class="p"></div><div class="p"></div></div>
          <div class="feature"><div class="icon"></div><div class="p"></div><div class="p"></div></div>
          <div class="feature"><div class="icon"></div><div class="p"></div><div class="p"></div></div>
        </div>

        <div class="pin" style="top: 540px; right: 28px;">⑤</div>
        <div class="greybox footer">
          <div class="col"><div class="link"></div><div class="link"></div><div class="link"></div></div>
          <div class="col"><div class="link"></div><div class="link"></div><div class="link"></div></div>
          <div class="col"><div class="link"></div><div class="link"></div><div class="link"></div></div>
          <div class="col"><div class="link"></div><div class="link"></div><div class="link"></div></div>
        </div>
      </div>
    </div>
  </div>
  <aside class="spec-panel" data-od-id="spec-panel">
    <div class="spec-title">Annotations / Spec</div>
    <div class="spec-row" data-od-id="spec-1"><span class="spec-num">①</span> Sticky nav, 64px, condenses on scroll.</div>
    <div class="spec-row" data-od-id="spec-2"><span class="spec-num">②</span> Hero H1 48/56, CTA pair primary + ghost.</div>
    <div class="spec-row" data-od-id="spec-3"><span class="spec-num">③</span> 5 partner logos, greyscale.</div>
    <div class="spec-row" data-od-id="spec-4"><span class="spec-num">④</span> 3-up at ≥960px → 1-up mobile.</div>
    <div class="spec-row" data-od-id="spec-5"><span class="spec-num">⑤</span> 4-col footer, legal row.</div>
  </aside>
</body>
</html>
</artifact>
