# Pre-commit hooks for the dotfiles repo.
# Hooks run only on files staged in a given commit, so existing files are not
# retroactively rewritten. Vendored/generated paths are excluded below.
exclude: |
  (?x)^(
    .claude/plugins/cache/.*|
    .*\.ruff_cache/.*|
    .*/__pycache__/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
