name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS runner: mcx is macOS-only (keychain shells out to /usr/bin/security)
    # and the shipped binary is darwin/arm64. macos-14+ runners are Apple Silicon.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
